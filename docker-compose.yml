services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。若宿主机挂载目录属主不同导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，两种解法任选：
    #   1) 宿主机执行：sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   2) 取消下一行注释以 root 运行（省事但容器逃逸面更大，自担）
    # user: "0:0"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json
